[package]
name = "flashsieve"
version = "0.1.3"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Storage-level pre-filtering for pattern matching, skip blocks that can't contain matches"
keywords = ["bloom-filter", "pattern-matching", "prefilter", "storage", "indexing"]
categories = ["algorithms", "data-structures"]
repository = "https://github.com/santhreal/flashsieve"
homepage = "https://santh.dev"
documentation = "https://docs.rs/flashsieve"
readme = "README.md"
authors = ["Santh <64453045+santhreal@users.noreply.github.com>"]
include = [
    "src/**/*.rs",
    "tests/**/*.rs",
    "benches/**/*.rs",
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
]

[package.metadata.santh]
status = "stable"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
thiserror = "2"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
rand = "0.9"
proptest = "1.6"
tempfile = "3.10"

[[bench]]
name = "filter_throughput"
harness = false

[[bench]]
name = "depth_bench"
harness = false


